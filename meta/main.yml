---
galaxy_info:
  role_name: compose_nginx
  namespace: local
  author: Kirill
  description: >-
    nginx as a Docker Compose stack, reverse-proxying the other compose
    stacks on the same host over a shared docker network. Installing Docker
    is left to other roles.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions: [bookworm, trixie]
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["9"]
  galaxy_tags:
    - docker
    - compose
    - nginx
    - reverseproxy
    - tls

# Docker is a hard requirement but installing it is not this role's job:
# tasks/main.yml checks for the `docker compose` plugin instead.
dependencies: []
