---
# Tests the role's mechanism with a trivial backend (traefik/whoami, which
# echoes the request), never with a real service - the test must prove the
# ROLE works, not that Nexus boots.
#
#   pip install -r requirements-dev.txt
#   molecule test

driver:
  name: docker

platforms:
  - name: compose-nginx-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    command: /lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance cannot keep its overlay storage on the
      # instance's own overlay root fs. Anonymous volumes give it a real
      # filesystem (same trick as the official docker:dind image).
      - /var/lib/containerd
      - /var/lib/docker
    keep_volumes: false     # remove those volumes on destroy

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
  inventory:
    group_vars:
      all:
        docker_install_compose_plugin: true
        docker_install_compose: false

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - create
    - prepare         # installs Docker
    - check           # --check on a fresh host: no config, network or stack yet
    - converge
    - idempotence     # the important one
    - check           # --check with nginx running: compose dry run
    - verify
    - destroy
