---
# Ansible content needed to lint and test this role. ansible-lint and Molecule
# install it automatically. To *use* the role you only need community.docker.
collections:
  # Used by the role: docker_compose_v2 (deploy and teardown). Molecule's
  # docker driver needs it for the tests as well.
  - name: community.docker
    version: ">=3.6.0"     # first release with docker_compose_v2

  # Test-only: Molecule's docker driver and the profile_tasks callback in
  # molecule/default/molecule.yml.
  - name: ansible.posix
    version: ">=1.4.0"

roles:
  # Test-only: installs Docker inside the Molecule instance (prepare.yml).
  - name: geerlingguy.docker
    version: 8.0.0
