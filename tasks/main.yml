---
# ==============================================================================
# 1. FAIL FAST - validate input before touching anything
# ==============================================================================

- name: Validate role input
  ansible.builtin.assert:
    that:
      - nginx_state in ['present', 'stopped', 'absent']
      - nginx_compose_project is match('^[a-z0-9][a-z0-9_-]*$')
      - nginx_compose_dir | length > 0
      - nginx_config_dir | length > 0
    fail_msg: >-
      compose_nginx: needs a lowercase nginx_compose_project, non-empty
      nginx_compose_dir / nginx_config_dir and an nginx_state of
      present/stopped/absent (got state='{{ nginx_state }}')
    quiet: true
  tags: [always]

- name: Validate that names are unique
  ansible.builtin.assert:
    that:
      - _site_names | unique | length == _site_names | length
      - _cert_names | unique | length == _cert_names | length
      - _snippet_names | unique | length == _snippet_names | length
      - nginx_http_snippets | difference(_snippet_names) | length == 0
    fail_msg: >-
      compose_nginx: site, certificate and snippet names must be unique across
      nginx_sites*, nginx_certificates* and nginx_snippets*, and
      nginx_http_snippets may only name defined snippets.
      Sites: {{ _site_names }}. Certificates: {{ _cert_names }}.
      Snippets: {{ _snippet_names }}.
    quiet: true
  vars:
    _site_names: "{{ _nginx_sites | map(attribute='name', default='') | list }}"
    _cert_names: "{{ _nginx_certificates | map(attribute='name', default='') | list }}"
    _snippet_names: "{{ _nginx_snippets | map(attribute='name', default='') | list }}"
  tags: [always]

- name: Validate the sites
  ansible.builtin.assert:
    that:
      - site.name | default('') is match(_nginx_name_re)
      - site.server_names | length > 0
      - (site.template is defined) or (site.backend | default('') is match(_nginx_backend_re))
      - (site.certificate | length == 0) or (site.certificate in _cert_names)
      - site.snippets | difference(_snippet_names) | length == 0
      - site.locations | rejectattr('path', 'defined') | list | length == 0
      - site.locations | selectattr('backend', 'defined') | map(attribute='backend')
        | reject('match', _nginx_backend_re) | list | length == 0
      - site.locations | map(attribute='snippets', default=[]) | flatten
        | difference(_snippet_names) | length == 0
      - (site.template is defined) or (site.backend is defined)
        or ('/' in site.locations | map(attribute='path') | list)
    fail_msg: >-
      compose_nginx: site '{{ site.name | default('?') }}' is invalid. It needs
      a name matching {{ _nginx_name_re }}, a server_name, a backend like
      http://container:port (or a `template`), a certificate from
      {{ _cert_names }} if any, snippets from {{ _snippet_names }} and a `path`
      on every location.
    quiet: true
  loop: "{{ _nginx_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.name | default('?') }}"
  vars:
    _cert_names: "{{ _nginx_certificates | map(attribute='name', default='') | list }}"
    _snippet_names: "{{ _nginx_snippets | map(attribute='name', default='') | list }}"
  when: nginx_state != 'absent'
  tags: [always]

- name: Validate the certificates
  ansible.builtin.assert:
    that:
      - cert.name | default('') is match(_nginx_name_re)
      - (cert.cert is defined) == (cert.key is defined)
      - not (cert.self_signed | bool and cert.cert is defined)
      - (not cert.self_signed | bool) or (cert.domains | length > 0)
    fail_msg: >-
      compose_nginx: certificate '{{ cert.name | default('?') }}' is invalid.
      It needs a name matching {{ _nginx_name_re }} and either both cert and
      key, or self_signed with domains (or a site that uses it), or neither.
    quiet: true
  loop: "{{ _nginx_certificates }}"
  loop_control:
    loop_var: cert
    label: "{{ cert.name | default('?') }}"
  when: nginx_state != 'absent'
  tags: [always]

- name: Validate the snippets
  ansible.builtin.assert:
    that:
      - snippet.name | default('') is match(_nginx_name_re)
      - (snippet.content is defined) != (snippet.src is defined)
    fail_msg: >-
      compose_nginx: snippet '{{ snippet.name | default('?') }}' needs a name
      matching {{ _nginx_name_re }} and exactly one of content or src.
    quiet: true
  loop: "{{ _nginx_snippets }}"
  loop_control:
    loop_var: snippet
    label: "{{ snippet.name | default('?') }}"
  when: nginx_state != 'absent'
  tags: [always]

# ==============================================================================
# 2. PREFLIGHT - the role depends on Docker, it does not install it
# ==============================================================================

- name: Get docker compose plugin version
  ansible.builtin.command: docker compose version --short
  register: _nginx_compose_ver
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [always]

- name: Require a docker compose plugin new enough for docker_compose_v2
  ansible.builtin.assert:
    that:
      - _nginx_compose_ver.rc == 0
      - _nginx_compose_ver.stdout | regex_replace('^v', '') is version(nginx_min_compose_version, '>=')
    fail_msg: >-
      compose_nginx: `docker compose` is missing or older than
      {{ nginx_min_compose_version }} on {{ inventory_hostname }}
      (got '{{ _nginx_compose_ver.stdout | default('') }}').
    quiet: true
  tags: [always]

# ==============================================================================
# 3. TEARDOWN - a separate path that does not end the play, so stacks
#    deployed after nginx in the same play still run
# ==============================================================================

- name: Remove the nginx stack
  ansible.builtin.import_tasks: teardown.yml
  when: nginx_state == 'absent'

# ==============================================================================
# 4. DEPLOY
# ==============================================================================

- name: Create the shared docker networks
  ansible.builtin.import_tasks: network.yml
  when: nginx_state != 'absent'

- name: Render the nginx configuration
  ansible.builtin.import_tasks: config.yml
  when: nginx_state != 'absent'

- name: Start nginx
  ansible.builtin.import_tasks: deploy.yml
  when: nginx_state != 'absent'
