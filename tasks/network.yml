---
# The network outlives the nginx stack: backends attach to it as `external`,
# so it is created here with the CLI rather than declared by nginx's compose
# file, where `docker compose down` would try to remove it from under them.

- name: Check which docker networks exist
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ item }}"]
  loop: "{{ _nginx_networks }}"
  register: _nginx_network_inspect
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [config, deploy]

- name: Create the missing docker networks
  ansible.builtin.command:
    argv: [docker, network, create, "{{ item }}"]
  loop: "{{ _nginx_network_inspect.results | rejectattr('rc', '==', 0) | map(attribute='item') | list }}"
  changed_when: true
  tags: [config, deploy]
