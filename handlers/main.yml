---
# Every rendered config file notifies this. A reload makes nginx re-read its
# config without dropping connections; `docker compose up` would not notice
# the change at all, because /etc/nginx is a bind mount, not compose config.
#
# The config test in tasks/config.yml has already passed when this runs.
# Retried because right after `docker compose up` created the container,
# nginx may still be starting and not have written its pid file yet.

- name: Reload nginx
  ansible.builtin.command:
    argv: "{{ _nginx_compose_cmd + ['exec', '-T', 'nginx', 'nginx', '-s', 'reload'] }}"
  register: _nginx_reload
  until: _nginx_reload.rc == 0
  retries: 5
  delay: 2
  changed_when: true
  when: nginx_state == 'present'
  listen: reload nginx
